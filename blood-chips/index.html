<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>带血筹码 · 只读快照</title>
<style>
  html,body{margin:0;padding:0;background:#fff}
  #boot{font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#888;padding:28px 20px}
  #nav{position:fixed;right:10px;bottom:10px;z-index:99999;font:13px/1 -apple-system,sans-serif;
       background:#111;color:#fff;opacity:.72;padding:9px 13px;border-radius:999px;text-decoration:none}
  #nav:hover{opacity:1}
</style>
</head>
<body>
<div id="boot">加载中…</div>
<script>
(function () {
  var NAV = '<a id="nav" href="../">← OI 面板</a>';
  fetch("panel.html", { cache: "no-store" })
    .then(function (r) { if (!r.ok) { throw new Error("HTTP " + r.status); } return r.text(); })
    .then(function (html) {
      var m = html.match(/<head[^>]*>/i);
      var inject = '<script src="shim.js"><\/script>';
      var out = m ? (html.slice(0, m.index + m[0].length) + inject + html.slice(m.index + m[0].length))
                  : (inject + html);
      out = out.replace(/<\/body>/i, NAV + "</body>");
      document.open(); document.write(out); document.close();
    })
    .catch(function (e) {
      document.getElementById("boot").textContent = "面板加载失败：" + e.message;
    });
})();
</script>
</body>
</html>
